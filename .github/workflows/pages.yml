# Workflow veřejného repozitáře se stránkou (NoHaCz/praha6-mapa, .github/workflows/pages.yml).
# Nakopíruje ho tam praha6/deploy.ps1 -Pages. Stránka jen přesměruje na novou mapu eDesky (presmerovani.html).
name: Stránka na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Složit stránku
        run: |
          mkdir site
          cp index.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
